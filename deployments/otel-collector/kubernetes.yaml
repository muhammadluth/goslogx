apiVersion: v1
kind: ConfigMap
metadata:
  name: goslogx-otel-collector
  namespace: observability
data:
  otel-collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol/queue
        timeout: 10s
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      resource/deployment:
        attributes:
          - key: collector.name
            value: ${env:POD_NAME}
            action: upsert
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: insert
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024
    exporters:
      otlp/backend:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true # Replace with CA/cert settings for remote production.
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 10000
          storage: file_storage
    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/deployment, batch]
          exporters: [otlp/backend]
      telemetry:
        logs:
          level: info
          encoding: json
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
---
apiVersion: v1
kind: Service
metadata:
  name: goslogx-otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: goslogx-otel-collector
spec:
  selector:
    app.kubernetes.io/name: goslogx-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: health
      port: 13133
      targetPort: health
    - name: metrics
      port: 8888
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goslogx-otel-collector
  namespace: observability
spec:
  serviceName: goslogx-otel-collector
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goslogx-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goslogx-otel-collector
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.148.0
          args: ["--config=/etc/otelcol/otel-collector.yaml"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_CLUSTER_NAME
              value: replace-me
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol/queue
      volumes:
        - name: config
          configMap:
            name: goslogx-otel-collector
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

