extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/queue
    timeout: 10s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resource/deployment:
    attributes:
      - key: collector.name
        value: ${env:COLLECTOR_NAME}
        action: upsert
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert
  # Defined but deliberately not enabled in the pipeline. Tail sampling keeps
  # complete traces in memory; size the Collector and tune policies first.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-normal-traffic
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

exporters:
  otlp/backend:
    endpoint: ${env:OTLP_BACKEND_ENDPOINT}
    tls:
      insecure: ${env:OTLP_BACKEND_INSECURE}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage

service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      # Add tail_sampling between resource/deployment and batch only after
      # validating memory usage and sampling policy for the deployment.
      processors: [memory_limiter, resource/deployment, batch]
      exporters: [otlp/backend]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true

